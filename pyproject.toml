[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-rocky-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Ansys Rocky discrete element method (DEM) simulations."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ansys-rocky-mcp contributors" }]
keywords = ["ansys", "rocky", "dem", "mcp", "model-context-protocol", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ansys-common-mcp>=0.3.6",
    "ansys-rocky-core>=0.6.2",
    "numpy>=1.21",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ansys-rocky-mcp = "ansys_rocky_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ansys/ansys-rocky-mcp"
Documentation = "https://github.com/ansys/ansys-rocky-mcp/blob/main/README.md"

[tool.flit.module]
name = "ansys_rocky_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# The FastMCP context is injected by the framework and is not documented.
"src/ansys_rocky_mcp/tools/*" = ["D417"]
